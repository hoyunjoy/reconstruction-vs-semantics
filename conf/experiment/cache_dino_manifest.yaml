# @package _global_

defaults:
  - /encoder: dino
  - _self_

seed: 42
image_size: 224
output_root: ${oc.env:DINO_WM_CACHE_ROOT,feature_cache}/dinov2_vits14_seed42
splits:
  - train
  - validation
  - test
batch_size: 64
amp: true
resume: true
log_every: 25

dataset:
  data_root: ${oc.env:DINO_WM_DATA_ROOT,data}/pusht_noise
  manifest_path: artifacts/splits/pusht_1000_seed42.json

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
