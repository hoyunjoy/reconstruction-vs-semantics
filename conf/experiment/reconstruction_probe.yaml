# @package _global_
defaults:
  - /cached_representation: vit_ae_s14
  - /reconstruction_decoder: matched_conv
  - _self_

seed: 42
dataset:
  data_root: ${oc.env:DINO_WM_DATA_ROOT,data}/pusht_noise
  manifest_path: artifacts/splits/pusht_1000_seed42.json
  frames_per_trajectory: {train: 32, validation: 16, test: 16}
  trajectories_per_batch: 2
  num_workers: 4
training:
  epochs: 20
  learning_rate: 3.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-5
  gradient_clip_norm: 1.0
  amp: true
  resume: true
  max_batches_per_epoch: null
evaluation:
  max_batches: null
outputs:
  checkpoint_dir: ${oc.env:DINO_WM_CHECKPOINT_ROOT,checkpoints}/reconstruction_probe/${cached_representation.name}_seed42
  output_dir: ${oc.env:DINO_WM_OUTPUT_ROOT,outputs}/reconstruction_probe/${cached_representation.name}_seed42
  best_checkpoint_name: best.pt
  last_checkpoint_name: last.pt
  history_name: history.json
  metrics_name: metrics.json
  grid_name: test_reconstructions.png
hydra:
  run: {dir: .}
  output_subdir: null
  job: {chdir: false}

